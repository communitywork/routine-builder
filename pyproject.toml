[project]
name = "fitblueprint"
version = "1.0.0"
description = "AI-powered workout plan generator with CSCS-quality training programs"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "streamlit>=1.35.0",
    "groq>=0.9.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
